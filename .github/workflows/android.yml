name: CineViet Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: App version name
        required: false
        default: 2.0.5
      release_channel:
        description: Release channel
        required: false
        default: release
      build_number:
        description: App build number / version code
        required: false
        default: "9216"
      require_signing:
        description: Fail when Android signing secrets are missing
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    branches:
      - main
      - cinevietappv2
    paths-ignore:
      - "README.md"
      - "release/**"

jobs:
  android:
    name: Android mobile/tablet and TV APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      VERSION_NAME: ${{ github.event.inputs.version_name || '2.0.5' }}
      RELEASE_CHANNEL: ${{ github.event.inputs.release_channel || 'release' }}
      BUILD_NUMBER: ${{ github.event.inputs.build_number || '9216' }}
      REQUIRE_ANDROID_SIGNING: ${{ github.event.inputs.require_signing || 'true' }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      CM_KEYSTORE_B64: ${{ secrets.CM_KEYSTORE_B64 }}
      CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
      CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
      CM_KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter clean/get
        run: |
          flutter clean
          flutter pub get

      - name: Analyze and test
        run: |
          timeout 8m flutter analyze --no-pub
          timeout 5m flutter test --no-pub

      - name: Prepare Android signing
        shell: bash
        run: |
          set -euo pipefail
          has_signing="false"
          if [ -f android/key.properties ]; then
            has_signing="true"
            echo "Android signing: android/key.properties found."
          else
            keystore_b64="${ANDROID_KEYSTORE_BASE64:-${CM_KEYSTORE_B64:-}}"
            store_password="${ANDROID_KEYSTORE_PASSWORD:-${CM_KEYSTORE_PASSWORD:-}}"
            key_alias="${ANDROID_KEY_ALIAS:-${CM_KEY_ALIAS:-}}"
            key_password="${ANDROID_KEY_PASSWORD:-${CM_KEY_PASSWORD:-}}"
            [ -n "${keystore_b64}" ] && echo "Android signing: keystore secret present." || echo "Android signing: keystore secret missing."
            [ -n "${store_password}" ] && echo "Android signing: store password present." || echo "Android signing: store password missing."
            [ -n "${key_alias}" ] && echo "Android signing: key alias present." || echo "Android signing: key alias missing."
            [ -n "${key_password}" ] && echo "Android signing: key password present." || echo "Android signing: key password missing."
          fi

          if [ "${has_signing}" != "true" ] && [ -n "${keystore_b64:-}" ] && [ -n "${store_password:-}" ] && [ -n "${key_alias:-}" ] && [ -n "${key_password:-}" ]; then
            keystore_path="${RUNNER_TEMP}/cineviet-release.jks"
            clean_b64="$(printf '%s' "${keystore_b64}" | tr -d '\r\n\t ' | sed -e 's/^ANDROID_KEYSTORE_BASE64[:=]//' -e 's/^CM_KEYSTORE_B64[:=]//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"
            if ! printf '%s' "${clean_b64}" | base64 --decode --ignore-garbage > "${keystore_path}"; then
              echo "Android signing: keystore secret is not valid base64."
              echo "Paste the raw content of CM_KEYSTORE_B64.txt into ANDROID_KEYSTORE_BASE64 or CM_KEYSTORE_B64."
              exit 1
            fi
            if [ ! -s "${keystore_path}" ]; then
              echo "Android signing: decoded keystore is empty."
              echo "Do not paste the .jks file path; paste the base64 text content."
              exit 1
            fi
            if ! keytool -list -keystore "${keystore_path}" -storepass "${store_password}" -alias "${key_alias}" >/dev/null; then
              echo "Android signing: decoded keystore cannot be opened with the supplied password and alias."
              echo "Check ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD."
              exit 1
            fi
            echo "ANDROID_KEYSTORE_PATH=${keystore_path}" >> "${GITHUB_ENV}"
            echo "ANDROID_KEYSTORE_PASSWORD=${store_password}" >> "${GITHUB_ENV}"
            echo "ANDROID_KEY_ALIAS=${key_alias}" >> "${GITHUB_ENV}"
            echo "ANDROID_KEY_PASSWORD=${key_password}" >> "${GITHUB_ENV}"
            has_signing="true"
            echo "Android signing: GitHub secret keystore decoded."
          fi

          if [ "${has_signing}" != "true" ]; then
            echo "Android signing: not configured; release APKs must use the canonical CineViet release keystore."
            if [ "${REQUIRE_ANDROID_SIGNING}" = "true" ]; then
              echo "REQUIRE_ANDROID_SIGNING=true, failing build because signing secrets are missing."
              exit 1
            fi
            echo "Continuing only because require_signing=false was selected; Gradle release tasks may still fail."
          fi

      - name: Build mobile/tablet universal APK
        shell: bash
        run: |
          set -euo pipefail
          build_number="${BUILD_NUMBER}"
          flutter build apk --release \
            --flavor mobile \
            --dart-define=APP_VARIANT=mobile \
            --dart-define=APP_IS_TV=false \
            --build-name="${VERSION_NAME}" \
            --build-number="${build_number}"

      - name: Build Android TV APK
        shell: bash
        run: |
          set -euo pipefail
          build_number="${BUILD_NUMBER}"
          flutter build apk --release \
            --flavor tv \
            --dart-define=APP_VARIANT=tv \
            --dart-define=APP_IS_TV=true \
            --build-name="${VERSION_NAME}" \
            --build-number="${build_number}"

      - name: Collect Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          build_number="${BUILD_NUMBER}"
          out_dir="build/app/outputs/cineviet-v2-github-release"
          mkdir -p "${out_dir}"
          cp build/app/outputs/flutter-apk/app-mobile-release.apk "${out_dir}/CineViet-v2-${RELEASE_CHANNEL}-Mobile-Tablet-universal-${VERSION_NAME}+${build_number}.apk"
          cp build/app/outputs/flutter-apk/app-tv-release.apk "${out_dir}/CineViet-v2-${RELEASE_CHANNEL}-Android-TV-universal-${VERSION_NAME}+${build_number}.apk"
          {
            echo "app=CineViet v2"
            echo "platform=android"
            echo "channel=${RELEASE_CHANNEL}"
            echo "version=${VERSION_NAME}"
            echo "build_number=${build_number}"
            echo "workflow=github-actions-android"
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "built_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${out_dir}/BUILD_INFO.txt"
          cp release/QA_CHECKLIST.md "${out_dir}/QA_CHECKLIST.md"
          cp release/RELEASE_NOTES_TEMPLATE.md "${out_dir}/RELEASE_NOTES_TEMPLATE.md"
          cp release/ANDROID_SIGNING.md "${out_dir}/ANDROID_SIGNING.md"
          ls -lh "${out_dir}"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cineviet-v2-android-${{ env.RELEASE_CHANNEL }}-${{ env.VERSION_NAME }}-${{ github.run_number }}
          path: build/app/outputs/cineviet-v2-github-release/*
          if-no-files-found: error
