name: CineViet iOS Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: App version name
        required: false
        default: 2.0.1
      release_channel:
        description: Release channel
        required: false
        default: release
      build_number:
        description: App build number
        required: false
        default: "9211"
  push:
    branches:
      - main
      - cinevietappv2
    paths-ignore:
      - "README.md"
      - "release/**"

jobs:
  ios:
    name: iOS unsigned app check
    runs-on: macos-15
    timeout-minutes: 90

    env:
      VERSION_NAME: ${{ github.event.inputs.version_name || '2.0.1' }}
      RELEASE_CHANNEL: ${{ github.event.inputs.release_channel || 'release' }}
      BUILD_NUMBER: ${{ github.event.inputs.build_number || '9211' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/**/*.xcodeproj/**', 'ios/**/*.xcworkspace/**', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Flutter clean/get
        run: |
          flutter clean
          flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          retry() {
            local attempt=1
            local max_attempts=3
            until "$@"; do
              if [ "${attempt}" -ge "${max_attempts}" ]; then
                return 1
              fi
              sleep_seconds=$((attempt * 30))
              echo "SwiftPM resolve failed, retrying in ${sleep_seconds}s (${attempt}/${max_attempts})..."
              sleep "${sleep_seconds}"
              attempt=$((attempt + 1))
            done
          }
          retry xcodebuild -resolvePackageDependencies \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          retry() {
            local attempt=1
            local max_attempts=3
            until "$@"; do
              if [ "${attempt}" -ge "${max_attempts}" ]; then
                return 1
              fi
              sleep_seconds=$((attempt * 45))
              echo "iOS build failed, retrying in ${sleep_seconds}s (${attempt}/${max_attempts})..."
              sleep "${sleep_seconds}"
              attempt=$((attempt + 1))
            done
          }
          retry flutter build ios --release --no-codesign \
            --dart-define=APP_VARIANT=ios \
            --build-name="${VERSION_NAME}" \
            --build-number="${BUILD_NUMBER}"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          ipa_dir="build/ios/unsigned_ipa"
          rm -rf "${ipa_dir}"
          mkdir -p "${ipa_dir}/Payload"
          cp -R build/ios/iphoneos/Runner.app "${ipa_dir}/Payload/"
          (
            cd "${ipa_dir}"
            ipa_name="CineViet-v2-${RELEASE_CHANNEL}-iOS-unsigned-${VERSION_NAME}+${BUILD_NUMBER}.ipa"
            zip -yr "${ipa_name}" Payload
            zip -9 "CineViet-v2-${RELEASE_CHANNEL}-iOS-unsigned-${VERSION_NAME}+${BUILD_NUMBER}.zip" "${ipa_name}"
            {
              echo "app=CineViet v2"
              echo "platform=ios"
              echo "channel=${RELEASE_CHANNEL}"
              echo "version=${VERSION_NAME}"
              echo "build_number=${BUILD_NUMBER}"
              echo "workflow=github-actions-ios"
              echo "commit=${GITHUB_SHA}"
              echo "branch=${GITHUB_REF_NAME}"
              echo "built_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            } > BUILD_INFO.txt
          )
          cp release/QA_CHECKLIST.md "${ipa_dir}/QA_CHECKLIST.md"
          cp release/RELEASE_NOTES_TEMPLATE.md "${ipa_dir}/RELEASE_NOTES_TEMPLATE.md"
          cp release/IOS_DISTRIBUTION.md "${ipa_dir}/IOS_DISTRIBUTION.md"

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cineviet-v2-ios-unsigned-${{ env.RELEASE_CHANNEL }}-${{ env.VERSION_NAME }}-${{ github.run_number }}
          path: |
            build/ios/unsigned_ipa/*.ipa
            build/ios/unsigned_ipa/*.zip
            build/ios/unsigned_ipa/BUILD_INFO.txt
            build/ios/unsigned_ipa/*.md
          if-no-files-found: error
